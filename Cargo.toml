[package]
name = "chrome-for-testing-manager"
version = "0.13.0"
edition = "2024"
rust-version = "1.89.0"
repository = "https://github.com/lpotthast/chrome-for-testing-manager"
description = """
Programmatic management of chrome-for-testing installations.
"""
categories = ["web-programming", "development-tools::testing"]
keywords = ["chrome", "chromedriver", "webdriver", "selenium", "browser-testing"]
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
exclude = [".claude", ".idea", ".vscode", "AGENTS.md", "CLAUDE.md", "Justfile"]

[features]
default = ["thirtyfour"]
thirtyfour = ["dep:futures", "dep:thirtyfour"]

[dependencies]
chrome-for-testing = "0.5.0"
directories = "6.0.0"
futures = { version = "0.3.0", optional = true }
reqwest = "0.13.2"
rootcause = "0.13.0"
serde_json = "1.0.145"
thirtyfour = { version = "0.37.0", optional = true }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-process-tools = "0.11.2"
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.41"
typed-builder = "0.23.2"
unwrap-infallible = "1.0.0"
zip = { version = "8.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assertr = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures = "0.3.0"
tokio = { version = "1.52.3", features = ["io-util", "net", "sync"] }
tracing-subscriber = "0.3.23"

# Integration tests exercising `thirtyfour` sessions are declared explicitly so feature-less
# builds (e.g. `cargo test --no-default-features`) skip them instead of failing to compile, and so
# doctests are compiled against the actually selected feature set.
[[test]]
name = "cancellation"
required-features = ["thirtyfour"]

[[test]]
name = "custom_graceful_shutdown"
required-features = ["thirtyfour"]

[[test]]
name = "headless_shell_session"
required-features = ["thirtyfour"]

[[test]]
name = "multiple_sessions"
required-features = ["thirtyfour"]

[[test]]
name = "single_session"
required-features = ["thirtyfour"]

[[test]]
name = "single_session_non_headless"
required-features = ["thirtyfour"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
